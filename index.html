<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main">
        <h2>Abdoulator</h2>
        <div class="calculator">
            <input type="text" id="fname" name="fname">


            <div class="buttons">
                <div class="firstRow">
                    <button class="number box">7</button>
                    <button class="number box">8</button>
                    <button class="number box">9</button>
                    <button class="clr box">clr</button>
                </div>


                <div class="secondRow">
                    <button class="number box">4</button>
                    <button class="number box">5</button>
                    <button class="number box">6</button>
                    <button class="plus box">+</button>
                    <button class="minus box">-</button>
                </div>


                <div class="thirdRow">
                    <button class="number box">1</button>
                    <button class="number box">2</button>
                    <button class="number box">3</button>
                    <button class="multiply box">x</button>
                    <button class="divide box">/</button>
                </div>


                <div class="fourthRow">
                    <button class="zero box">0</button>
                    <button class="point box">.</button>
                    <button class="equal box">=</button>
                </div>
            </div>


        </div>
    </div>

</body>

</html>
